<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kalshi desk live</title>
<link rel="stylesheet" href="board.css" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
<header>
  <div class="pulse"></div>
  <div class="brand">Kalshi desk · <span>idx-0 weather</span></div>
  <div class="metrics">
    <div class="m"><label>Cash</label><b id="cash">-</b></div>
    <div class="m up"><label>All-in mid</label><b id="allin">-</b></div>
    <div class="m"><label>All-in bid</label><b id="allinBid">-</b></div>
    <div class="m" id="pnlMetric"><label>Trading P/L</label><b id="tradePnl">-</b></div>
    <div class="m"><label>As of</label><b id="asof">-</b></div>
  </div>
  <div class="clock" id="clock"></div>
</header>

<div class="totals" id="totals"></div>

<div class="grid">
  <div class="panel" id="chartWrap">
    <div class="chart-head">
      <h2>Growth · cash vs all-in</h2>
      <div class="legend-note" id="growthNote"></div>
    </div>
    <canvas id="pnl"></canvas>
    <div class="note">Thursday jump is the deposit, not trading P/L. Friday lift is HOU NOLA DC printing. Trading P/L strips known adds from all-in.</div>
  </div>
  <div class="panel" id="tape">
    <h2>Realtime tape</h2>
    <div id="tape-list"></div>
  </div>
  <div class="cols">
    <div class="panel"><h2>Book</h2><table id="book"></table></div>
    <div class="panel"><h2>Seats</h2><div class="seats" id="seats"></div></div>
  </div>
</div>
<script src="board.js"></script>
</body>
</html>
