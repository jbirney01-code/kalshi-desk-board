<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<title>Kalshi Desk IDX-0</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root { --bg:#07071a; --fg:#e8f6ff; --muted:#8aa0b8; --faint:#4d6080; --mint:#3dffa6; --cyan:#5ce1ff; --gold:#ffc14a; --dead:#ff5d7a; --chart-h:148px; --title:"Chakra Petch","IBM Plex Mono",sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace; }
* { box-sizing:border-box; }
html,body { margin:0; min-height:100%; background:var(--bg); color:var(--fg); font-family:var(--mono); }
body { min-height:100dvh; }
.desk { position:relative; isolation:isolate; display:flex; flex-direction:column; gap:8px; min-height:100dvh; padding:10px; background:radial-gradient(720px 420px at 50% 58%,rgba(92,225,255,.1),transparent 58%),#07071a; }
@media (min-width:1024px){ .desk { height:100dvh; overflow:hidden; } }
.hud { background:rgba(7,7,26,.55); box-shadow:0 0 0 1px rgba(92,225,255,.14); border-radius:12px; }
header.hud { display:grid; gap:12px; padding:10px 14px; align-items:end; }
@media (min-width:1024px){ header.hud { grid-template-columns:minmax(0,1.2fr) minmax(0,2fr) auto; } }
.led { width:8px; height:8px; border-radius:99px; background:var(--mint); box-shadow:0 0 10px var(--mint); animation:led 1.8s ease-in-out infinite; }
h1 { margin:0; font-family:var(--title); font-size:20px; letter-spacing:.1em; text-transform:uppercase; }
h1 span { color:var(--mint); }
.score { margin:4px 0 0; color:var(--muted); font-size:10px; letter-spacing:.12em; text-transform:uppercase; }
.stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px 16px; }
.stat label,.clock label,.tot label { display:block; font-family:var(--title); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); }
.stat b,.clock b,.tot b { font-size:15px; font-weight:500; font-variant-numeric:tabular-nums; }
.mint{color:var(--mint)} .cyan{color:var(--cyan)} .gold{color:var(--gold)} .dead{color:var(--dead)}
.clock{text-align:right}
.ticker{overflow:hidden;padding:6px 12px}
.ticker-track{display:flex;gap:32px;width:max-content;animation:ticker 38s linear infinite}
.ticker-track span{font-family:var(--title);font-size:12px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
.main{display:grid;grid-template-columns:1fr;gap:10px;min-height:0;flex:1}
@media (min-width:1024px){ .main{grid-template-columns:minmax(0,1.7fr) minmax(240px,.7fr);} }
.floor{display:flex;flex-direction:column;gap:8px;min-height:0}
.hero{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:1024px){ .hero{grid-template-columns:minmax(0,1.25fr) minmax(200px,.7fr);height:236px;} .hero .chart{height:100%} }
.chart{height:var(--chart-h);display:flex;flex-direction:column;overflow:hidden}
.chart-head{display:flex;justify-content:space-between;padding:8px 12px 0}
.chart-head span,.tape h2{font-family:var(--title);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.chart-box{position:relative;flex:1;min-height:0}
.chart-box canvas{position:absolute;inset:0;width:100%!important;height:100%!important}
.orb-stage{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:180px}
.orb-wrap{position:relative;width:min(120px,28vw);height:min(120px,28vw)}
.orb-wrap img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 28px rgba(92,225,255,.35))}
.route{position:absolute;top:8%;right:-2%;z-index:2;border-radius:999px;padding:6px 11px;background:rgba(7,7,26,.7);box-shadow:0 0 0 1px rgba(92,225,255,.4);font-family:var(--title);font-size:10px;letter-spacing:.22em;text-transform:uppercase}
.orb-title{margin:8px 0 0;font-family:var(--title);letter-spacing:.32em;text-transform:uppercase;font-size:16px}
.stations{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-height:0;flex:1}
@media (min-width:1024px){ .stations{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:1fr 1fr;} }
.station{display:flex;flex-direction:column;min-height:160px;overflow:hidden;border-radius:18px;background:#050512;box-shadow:0 0 0 1px rgba(92,225,255,.16)}
.station-art{position:relative;overflow:hidden;flex:1;min-height:0}
.station-art img{width:100%;height:100%;object-fit:contain;object-position:center;display:block}
.station-meta{padding:6px 9px 2px;background:rgba(7,7,26,.55)}
.station-meta .row{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.station-meta h2{margin:0;font-family:var(--title);font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.station-meta .role{font-family:var(--title);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.station-meta p{margin:0;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sprite-canvas{position:absolute;left:50%;bottom:2%;width:108px;height:108px;margin-left:-54px;image-rendering:pixelated;pointer-events:none;z-index:3;filter:drop-shadow(0 8px 10px rgba(0,0,0,.6))}
.tape{display:flex;flex-direction:column;min-height:220px;overflow:hidden}
@media (min-width:1024px){ .tape{min-height:0;height:100%} }
.tape h2{margin:0;padding:8px 12px 0}
#tape-list{flex:1;overflow:auto;padding:8px 12px 16px;display:flex;flex-direction:column;gap:6px}
.ev .meta{display:flex;gap:8px;font-size:11px;color:var(--faint)}
.ev .who{font-family:var(--title);color:var(--cyan);letter-spacing:.08em;text-transform:uppercase}
.ev .text{color:var(--muted);font-size:11px}
.totals{display:grid;grid-template-columns:repeat(6,1fr);gap:8px 16px;padding:10px 14px}
@media (max-width:900px){ .totals{grid-template-columns:1fr 1fr} .stats{grid-template-columns:1fr 1fr} }
@keyframes led{50%{opacity:.45}}
@keyframes ticker{to{transform:translateX(-50%)}}
@keyframes fall{to{transform:translateY(70vh) rotate(220deg);opacity:0}}
.confetti{position:fixed;width:8px;height:10px;z-index:40;animation:fall 1.15s linear forwards}
</style>
</head>
<body>
<main class="desk">
  <header class="hud">
    <div><div style="display:flex;align-items:center;gap:8px"><span class="led"></span><h1>Kalshi Desk IDX-0 <span>Weather Live</span></h1></div><p class="score" id="scoreboard"></p></div>
    <div class="stats">
      <div class="stat"><label>Cash</label><b id="cash" class="cyan">—</b></div>
      <div class="stat"><label>All-in</label><b id="allin" class="mint">—</b></div>
      <div class="stat"><label>Bid</label><b id="allinBid" class="cyan">—</b></div>
      <div class="stat"><label>Trading P/L</label><b id="tradePnl">—</b></div>
    </div>
    <div class="clock"><div class="stat"><label>As-of</label><b id="asof">—</b></div><div style="margin-top:6px"><label>ET clock</label><b id="clock" class="gold">—</b></div></div>
  </header>
  <div class="hud ticker"><div class="ticker-track" id="ticker">loading desk…</div></div>
  <div class="main">
    <div class="floor">
      <div class="hero">
        <div class="hud chart"><div class="chart-head"><span>Growth</span><div class="legend"><span class="gold">Trading P/L</span></div></div><div class="chart-box"><canvas id="pnl"></canvas></div></div>
        <section class="orb-stage"><div class="orb-wrap" style="position:relative"><div class="route cyan" id="route">Routing · Desk</div><img src="desk/orb.png?v=floor8" alt="" /><h2 class="orb-title">Chief of Weather</h2></div></section>
      </div>
      <div class="stations" id="stations"></div>
    </div>
    <aside class="hud tape"><h2>Tape</h2><div id="tape-list"></div></aside>
  </div>
  <footer class="hud totals" id="totals"></footer>
</main>
<script src="board.js?v=floor8"></script>
</body>
</html>
