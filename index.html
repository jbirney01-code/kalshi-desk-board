<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<title>Kalshi Desk IDX-0</title>
<style>
.sprite-canvas {
  position: absolute;
  left: 50%;
  bottom: 2%;
  width: 108px;
  height: 108px;
  margin-left: -54px;
  image-rendering: pixelated;
  pointer-events: none;
  z-index: 3;
  filter: drop-shadow(0 8px 10px rgba(0,0,0,.6));
}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #07071a;
  --fg: #e8f6ff;
  --muted: #8aa0b8;
  --faint: #4d6080;
  --mint: #3dffa6;
  --cyan: #5ce1ff;
  --gold: #ffc14a;
  --dead: #ff5d7a;
  --chart-h: 168px;
  --title: "Chakra Petch", "IBM Plex Mono", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--mono);
}
body {
  min-height: 100dvh;
}
.desk {
  position: relative;
  isolation: isolate;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 100dvh;
  padding: 10px;
  background:
    radial-gradient(720px 420px at 50% 58%, rgba(92, 225, 255, 0.1), transparent 58%),
    radial-gradient(900px 380px at 18% 30%, rgba(61, 255, 166, 0.05), transparent 50%),
    #07071a;
}
.desk::before {
  content: "";
  pointer-events: none;
  position: absolute;
  inset: 0;
  z-index: -1;
  background-image: radial-gradient(rgba(92, 225, 255, 0.09) 1px, transparent 1px);
  background-size: 22px 22px;
  mask-image: radial-gradient(circle at 50% 55%, #000 0 40%, transparent 78%);
}
@media (min-width: 1024px) {
  .desk { height: 100dvh; overflow: hidden; }
}
.hud {
  background: rgba(7, 7, 26, 0.55);
  box-shadow: 0 0 0 1px rgba(92, 225, 255, 0.14);
  border-radius: 12px;
  backdrop-filter: blur(10px);
}
header.hud {
  display: grid;
  gap: 12px;
  padding: 10px 14px;
  align-items: end;
}
@media (min-width: 1024px) {
  header.hud { grid-template-columns: minmax(0, 1.2fr) minmax(0, 2fr) auto; }
}
.led {
  width: 8px; height: 8px; border-radius: 99px;
  background: var(--mint); box-shadow: 0 0 10px var(--mint);
  animation: led 1.8s ease-in-out infinite;
}
h1 {
  margin: 0;
  font-family: var(--title);
  font-size: 20px;
  letter-spacing: .1em;
  text-transform: uppercase;
}
h1 span { color: var(--mint); }
.score { margin: 4px 0 0; color: var(--muted); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; }
@media (min-width: 640px) { .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.stat label, .clock label, .tot label {
  display: block;
  font-family: var(--title);
  font-size: 10px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--faint);
}
.stat b, .clock b, .tot b { font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums; }
.mint { color: var(--mint); } .cyan { color: var(--cyan); } .gold { color: var(--gold); } .dead { color: var(--dead); }
.clock { text-align: right; }
.ticker { overflow: hidden; padding: 6px 12px; }
.ticker-track { display: flex; gap: 32px; width: max-content; animation: ticker 38s linear infinite; }
.ticker-track span { font-family: var(--title); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; white-space: nowrap; }
.main {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
  min-height: 0;
  flex: 1;
}
@media (min-width: 1024px) {
  .main { grid-template-columns: minmax(0, 1.7fr) minmax(240px, 0.7fr); }
}
.floor { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
.hero {
  display: block;
  flex: none;
}
@media (min-width: 1024px) {
  .hero { height: var(--chart-h); }
  .hero .chart { height: 100%; }
}
.chart { height: var(--chart-h); display: flex; flex-direction: column; overflow: hidden; }
.chart-head { display: flex; justify-content: space-between; padding: 8px 12px 0; }
.chart-head span, .tape h2 {
  font-family: var(--title);
  font-size: 10px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--faint);
}
.legend { display: flex; gap: 12px; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
.chart-box { position: relative; flex: 1; min-height: 0; }
.chart-box canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; }
.route {
  border-radius: 999px; padding: 4px 10px;
  background: rgba(7,7,26,.7);
  box-shadow: 0 0 0 1px rgba(92,225,255,.4);
  font-family: var(--title); font-size: 10px; letter-spacing: .18em; text-transform: uppercase;
  white-space: nowrap;
}
.stations {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  min-height: 0;
  flex: 1;
}
@media (min-width: 1024px) {
  .stations { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: 1fr 1fr; }
}
.station {
  display: flex; flex-direction: column; min-height: 160px; overflow: hidden;
  border-radius: 18px; background: #050512;
  box-shadow: 0 0 0 1px rgba(92,225,255,.16), 0 18px 28px rgba(0,0,0,.35);
}
.station-art { position: relative; overflow: hidden; }
.station-art img {
  transform-origin: 50% 62%;
  will-change: transform;
}
.station:nth-child(1) img { animation: bot-scan 3.2s ease-in-out infinite; }
.station:nth-child(2) img { animation: bot-lean 2.8s ease-in-out infinite; }
.station:nth-child(3) img { animation: bot-nod 2.1s ease-in-out infinite; }
.station:nth-child(4) img { animation: bot-type 1.15s ease-in-out infinite; }
.station:nth-child(5) img { animation: bot-print 2.6s ease-in-out infinite; }
.station:nth-child(6) img { animation: bot-ledger 3.4s ease-in-out infinite; }
.station-art::after {
  content: "";
  position: absolute; inset: 0; pointer-events: none;
  background:
    linear-gradient(180deg, transparent 0 42%, rgba(92,225,255,.12) 50%, transparent 58%),
    radial-gradient(circle at 50% 40%, rgba(61,255,166,.18), transparent 34%);
  mix-blend-mode: screen;
  animation: visor 1.8s ease-in-out infinite;
}
.station:nth-child(2) .station-art::after { animation-delay: .3s; }
.station:nth-child(3) .station-art::after { animation-delay: .6s; }
.station:nth-child(4) .station-art::after { animation-delay: .15s; }
.station:nth-child(5) .station-art::after { animation-delay: .9s; }
.station:nth-child(6) .station-art::after { animation-delay: 1.2s; }
.hands {
  position: absolute; left: 50%; bottom: 17%;
  width: 18%; height: 5px; margin-left: -9%;
  border-radius: 4px;
  pointer-events: none;
}
.station:nth-child(3) .hands,
.station:nth-child(4) .hands,
.station:nth-child(6) .hands {
  background: rgba(92,225,255,.4);
  box-shadow: 0 0 12px rgba(92,225,255,.5);
  animation: keys .28s steps(2) infinite;
}
.station-meta { padding: 6px 9px 2px; background: rgba(7,7,26,.55); }
.station-meta .row { display: flex; justify-content: space-between; gap: 6px; align-items: baseline; }
.station-meta h2 {
  margin: 0; font-family: var(--title); font-size: 14px; letter-spacing: .08em; text-transform: uppercase;
}
.station-meta .role { font-family: var(--title); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; }
.station-meta p { margin: 0; color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.station-art { flex: 1; min-height: 0; }
.station-art img { width: 100%; height: 100%; object-fit: contain; object-position: center; display: block; }
.tape { display: flex; flex-direction: column; min-height: 220px; overflow: hidden; }
@media (min-width: 1024px) { .tape { min-height: 0; height: 100%; } }
.tape h2 { margin: 0; padding: 8px 12px 0; }
#tape-list { flex: 1; overflow: auto; padding: 8px 12px 16px; display: flex; flex-direction: column; gap: 6px; }
.ev { padding: 4px 4px; }
.ev .meta { display: flex; gap: 8px; font-size: 11px; color: var(--faint); }
.ev .who { font-family: var(--title); color: var(--cyan); letter-spacing: .08em; text-transform: uppercase; }
.ev .text { color: var(--muted); font-size: 11px; line-height: 1.35; }
.totals { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; padding: 10px 14px; }
@media (min-width: 640px) { .totals { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 1024px) { .totals { grid-template-columns: repeat(6, 1fr); } }
.confetti {
  position: fixed; width: 8px; height: 10px; z-index: 40;
  animation: fall 1.15s linear forwards;
}
@keyframes bot-scan {
  0%,100% { transform: translate(0,0) rotate(0); }
  25% { transform: translate(2px,-3px) rotate(.6deg); }
  50% { transform: translate(0,-5px) rotate(0); }
  75% { transform: translate(-2px,-3px) rotate(-.6deg); }
}
@keyframes bot-lean {
  0%,100% { transform: translateY(0) rotate(0); }
  40% { transform: translateY(-3px) rotate(-1.5deg); }
  70% { transform: translateY(-2px) rotate(1.2deg); }
}
@keyframes bot-nod {
  0%,100% { transform: translateY(0) scale(1,1); }
  30% { transform: translateY(2px) scale(1.01,.98); }
  55% { transform: translateY(-5px) scale(.99,1.03); }
}
@keyframes bot-type {
  0%,100% { transform: translate(0,0) rotate(0); }
  25% { transform: translate(-1px,1px) rotate(-.5deg); }
  50% { transform: translate(1px,0) rotate(.5deg); }
  75% { transform: translate(-1px,1px) rotate(-.3deg); }
}
@keyframes bot-print {
  0%,100% { transform: translateY(0) rotate(0); }
  20% { transform: translateY(-6px) rotate(.5deg); }
  35% { transform: translateY(1px) rotate(0); }
  70% { transform: translateY(-2px) rotate(-.4deg); }
}
@keyframes bot-ledger {
  0%,100% { transform: translateX(0) rotate(0); }
  50% { transform: translateX(3px) rotate(.6deg); }
}
@keyframes visor {
  0%,100% { opacity: .3; }
  50% { opacity: .85; }
}
@keyframes keys {
  0% { transform: scaleX(1); opacity: .25; }
  50% { transform: scaleX(1.18); opacity: .9; }
}
@keyframes led { 50% { opacity: .45; } }
@keyframes ticker { to { transform: translateX(-50%); } }
@keyframes fall { to { transform: translateY(70vh) rotate(220deg); opacity: 0; } }
</style>
</head>
<body>
<main class="desk">
  <header class="hud">
    <div>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="led"></span>
        <h1>Kalshi Desk IDX-0 <span>Weather Live</span></h1>
      </div>
      <p class="score" id="scoreboard"></p>
    </div>
    <div class="stats">
      <div class="stat"><label>Cash</label><b id="cash" class="cyan">—</b></div>
      <div class="stat"><label>All-in</label><b id="allin" class="mint">—</b></div>
      <div class="stat"><label>Bid</label><b id="allinBid" class="cyan">—</b></div>
      <div class="stat"><label>Trading P/L</label><b id="tradePnl">—</b></div>
    </div>
    <div class="clock">
      <div class="stat"><label>As-of</label><b id="asof">—</b></div>
      <div style="margin-top:6px"><label>ET clock</label><b id="clock" class="gold">—</b></div>
    </div>
  </header>
  <div class="hud ticker"><div class="ticker-track" id="ticker">loading desk…</div></div>
  <div class="main">
    <div class="floor">
      <div class="hero">
        <div class="hud chart">
          <div class="chart-head">
            <span>Trading P/L</span>
            <div class="legend">
              <span class="gold">Growth</span>
              <span class="route cyan" id="route">Routing · Desk</span>
            </div>
          </div>
          <div class="chart-box"><canvas id="pnl"></canvas></div>
        </div>
      </div>
      <div class="stations" id="stations"></div>
    </div>
    <aside class="hud tape">
      <h2>Tape</h2>
      <div id="tape-list"></div>
    </aside>
  </div>
  <footer class="hud totals" id="totals"></footer>
</main>
<script src="board.js?v=widepnl"></script>
<script src="sprites.js?v=sheet2"></script>
</body>
</html>
